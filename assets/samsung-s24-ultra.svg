<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d57" />
      <stop offset="50%" stop-color="#282a30" />
      <stop offset="100%" stop-color="#191a1e" />
    </linearGradient>
    <radialGradient id="s24Lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="spenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Sharp Boxy Titanium Body (S24 Ultra Iconic Shape) -->
  <rect x="75" y="30" width="245" height="540" rx="14" fill="url(#titaniumFrame)" stroke="#64748b" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Left Camera Column (Triple 200MP + Periscope) -->
  <circle cx="125" cy="100" r="28" fill="#1e222d" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="125" cy="100" r="21" fill="url(#s24Lens)"/>
  <circle cx="120" cy="95" r="4" fill="#fff" opacity="0.8"/>

  <circle cx="125" cy="175" r="28" fill="#1e222d" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="125" cy="175" r="21" fill="url(#s24Lens)"/>
  <circle cx="120" cy="170" r="4" fill="#fff" opacity="0.8"/>

  <circle cx="125" cy="250" r="28" fill="#1e222d" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="125" cy="250" r="21" fill="url(#s24Lens)"/>
  <circle cx="120" cy="245" r="4" fill="#fff" opacity="0.8"/>

  <!-- Right Sensor & 3x Telephoto Column -->
  <circle cx="185" cy="100" r="16" fill="#1e222d" stroke="#64748b" stroke-width="2"/>
  <circle cx="185" cy="100" r="9" fill="#00f59b"/>

  <circle cx="185" cy="148" r="12" fill="#fff" stroke="#ffb703" stroke-width="2"/>

  <circle cx="185" cy="195" r="20" fill="#1e222d" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="185" cy="195" r="14" fill="url(#s24Lens)"/>

  <!-- Galaxy AI Badge -->
  <rect x="110" y="340" width="175" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="197" y="362" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✨ GALAXY AI 100X</text>

  <!-- S-Pen Visual Beside or on body -->
  <rect x="330" y="80" width="12" height="420" rx="6" fill="url(#spenGrad)" stroke="#38bdf8" stroke-width="1.5" filter="drop-shadow(0 5px 15px rgba(56,189,248,0.4))"/>
  <path d="M 330 80 L 336 60 L 342 80 Z" fill="#38bdf8"/>
  <text x="336" y="280" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" transform="rotate(-90 336 280)" letter-spacing="2">S-PEN</text>

  <!-- Brand logo -->
  <text x="197" y="530" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="4" opacity="0.8">SAMSUNG</text>
</svg>
