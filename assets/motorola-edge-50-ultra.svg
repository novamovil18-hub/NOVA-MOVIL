<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <!-- Wood grain pattern / warm gradient -->
    <linearGradient id="nordicWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b" />
      <stop offset="35%" stop-color="#a0693b" />
      <stop offset="70%" stop-color="#6e421f" />
      <stop offset="100%" stop-color="#543114" />
    </linearGradient>
    <radialGradient id="motoLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#000" />
    </radialGradient>
  </defs>

  <!-- Seamless Curved Body (Curved Edges) -->
  <rect x="75" y="30" width="250" height="540" rx="38" fill="url(#nordicWood)" stroke="#d97706" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Organic Integrated Camera Island -->
  <path d="M 90 50 Q 90 40 105 40 L 220 40 Q 235 40 235 60 L 235 190 Q 235 210 215 210 L 105 210 Q 90 210 90 190 Z" fill="#6e421f" opacity="0.6"/>

  <!-- 3 Camera Lenses -->
  <circle cx="140" cy="90" r="26" fill="#181512" stroke="#d97706" stroke-width="3"/>
  <circle cx="140" cy="90" r="18" fill="url(#motoLens)"/>

  <circle cx="140" cy="155" r="26" fill="#181512" stroke="#d97706" stroke-width="3"/>
  <circle cx="140" cy="155" r="18" fill="url(#motoLens)"/>

  <!-- Periscope Rectangular Lens -->
  <rect x="180" y="75" width="30" height="30" rx="6" fill="#000" stroke="#d97706" stroke-width="2"/>
  <rect x="184" y="79" width="22" height="22" rx="3" fill="#0284c7"/>

  <!-- Motorola Batwing Logo -->
  <circle cx="200" cy="300" r="24" fill="#000" stroke="#d97706" stroke-width="2"/>
  <path d="M 188 308 Q 194 290 200 302 Q 206 290 212 308 Q 206 300 200 308 Q 194 300 188 308 Z" fill="#d97706"/>

  <!-- Curved Screen & Real Wood Badge -->
  <rect x="95" y="380" width="210" height="34" rx="17" fill="rgba(217, 119, 6, 0.2)" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="402" fill="#fbbf24" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">🌊 CURVA 3D + MADERA REAL</text>

  <!-- 125W TurboPower Badge -->
  <rect x="110" y="430" width="180" height="28" rx="14" fill="rgba(0, 245, 155, 0.15)" stroke="#00f59b" stroke-width="1"/>
  <text x="200" y="448" fill="#00f59b" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">⚡ 125W CARGA ULTRA EN 6 MIN</text>

  <!-- Brand logo -->
  <text x="200" y="530" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="3" opacity="0.8">MOTOROLA</text>
</svg>
