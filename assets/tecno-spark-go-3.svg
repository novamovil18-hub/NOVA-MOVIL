  <circle cx="150" cy="115" r="14" fill="#15803d"/>
  <circle cx="147" cy="112" r="3" fill="#fff" opacity="0.8"/>

  <circle cx="150" cy="175" r="24" fill="#000" stroke="#4ade80" stroke-width="3"/>
