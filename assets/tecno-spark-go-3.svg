      <stop offset="100%" stop-color="#020d06" />
    </linearGradient>
  </defs>
  <rect x="75" y="30" width="250" height="540" rx="36" fill="url(#tecnoSparkBg)" stroke="#22c55e" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Large Camera Island -->
  <rect x="95" y="70" width="115" height="150" rx="26" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
