<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="flipBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="screenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Foldable Top Half -->
  <rect x="85" y="40" width="230" height="240" rx="28" fill="url(#flipBlue)" stroke="#7dd3fc" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>

  <!-- FlexWindow Outer Screen (Folder Shaped) -->
  <path d="M 100 55 L 290 55 Q 305 55 305 70 L 305 210 Q 305 225 290 225 L 175 225 Q 160 225 155 210 L 155 125 Q 155 110 140 110 L 100 110 Q 85 110 85 95 L 85 70 Q 85 55 100 55 Z" fill="url(#screenGloss)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Clock on FlexWindow -->
  <text x="230" y="105" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="34" text-anchor="middle">21:06</text>
  <text x="230" y="130" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Domingo, 27 Sept</text>

  <!-- Dual Outer Cameras Cutout -->
  <circle cx="115" cy="80" r="16" fill="#000" stroke="#7dd3fc" stroke-width="2.5"/>
  <circle cx="115" cy="80" r="10" fill="#0284c7"/>
  <circle cx="115" cy="140" r="16" fill="#000" stroke="#7dd3fc" stroke-width="2.5"/>
  <circle cx="115" cy="140" r="10" fill="#0284c7"/>

  <!-- Armor Aluminum Zero-Gap Hinge Line -->
  <rect x="75" y="283" width="250" height="14" rx="7" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="294" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="2">ARMOR HINGE</text>

  <!-- Bottom Foldable Half -->
  <rect x="85" y="300" width="230" height="240" rx="28" fill="url(#flipBlue)" stroke="#7dd3fc" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>

  <!-- Badge on Bottom -->
  <rect x="110" y="380" width="180" height="34" rx="17" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="402" fill="#e0f2fe" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">📱 PLEGABLE COMPACTO</text>

  <rect x="125" y="430" width="150" height="28" rx="14" fill="rgba(0, 245, 155, 0.15)" stroke="#00f59b" stroke-width="1"/>
  <text x="200" y="448" fill="#00f59b" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">📸 FLEXCAM MANOS LIBRES</text>

  <!-- Brand logo -->
  <text x="200" y="515" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle" letter-spacing="4" opacity="0.9">SAMSUNG</text>
</svg>
