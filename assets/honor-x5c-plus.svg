<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="honorCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect x="75" y="30" width="250" height="540" rx="36" fill="url(#honorCyanGrad)" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>
  <!-- Dual Ring Camera -->
  <circle cx="130" cy="100" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="130" cy="100" r="20" fill="#0284c7"/>
  <circle cx="126" cy="96" r="4" fill="#fff" opacity="0.8"/>
  <text x="130" y="145" fill="#38bdf8" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">50MP DUAL</text>

  <circle cx="130" cy="190" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="130" cy="190" r="16" fill="#0284c7"/>
  <circle cx="180" cy="100" r="10" fill="#fff" stroke="#ffb703" stroke-width="2"/>

  <!-- RAM & Storage badge -->
  <rect x="100" y="340" width="200" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="362" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">⚡ 6GB + 256GB MEMORIA</text>

  <!-- Battery -->
  <rect x="110" y="390" width="180" height="28" rx="14" fill="rgba(0, 245, 155, 0.15)" stroke="#00f59b" stroke-width="1"/>
  <text x="200" y="408" fill="#00f59b" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">🔋 5200 mAh (2 DÍAS)</text>

  <!-- Price in Bolivianos -->
  <text x="200" y="475" fill="#00f59b" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="24" text-anchor="middle">Bs. 1.830</text>
  <text x="200" y="495" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">US$ 146,99</text>

  <text x="200" y="540" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="3" opacity="0.9">HONOR X5C PLUS</text>
</svg>
