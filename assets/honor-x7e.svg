<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="honorSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>
  </defs>
  <rect x="75" y="30" width="250" height="540" rx="36" fill="url(#honorSilverGrad)" stroke="url(#goldAccent)" stroke-width="2.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>
  
  <!-- Big 108MP Matrix Ring -->
  <circle cx="200" cy="150" r="65" fill="#0f172a" stroke="url(#goldAccent)" stroke-width="5"/>
  <circle cx="200" cy="150" r="32" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="195" cy="145" r="5" fill="#fff" opacity="0.9"/>
  <text x="200" y="235" fill="#ffd700" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">108 MP MATRIX OIS</text>

  <!-- Giant 6000 mAh Badge -->
  <rect x="95" y="320" width="210" height="34" rx="17" fill="rgba(255, 215, 0, 0.15)" stroke="#ffd700" stroke-width="1.5"/>
  <text x="200" y="342" fill="#ffd700" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">🔋 BATERÍA 6000 mAh (3 DÍAS)</text>

  <!-- Specs pill -->
  <rect x="110" y="370" width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="388" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">⚡ 6GB + 256GB MEMORIA</text>

  <!-- Price -->
  <text x="200" y="465" fill="#00f59b" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="25" text-anchor="middle">Bs. 2.550</text>
  <text x="200" y="485" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">US$ 204,82</text>

  <text x="200" y="540" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="3" opacity="0.9">HONOR X7E</text>
</svg>
