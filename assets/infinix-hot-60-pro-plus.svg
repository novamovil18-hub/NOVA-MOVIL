<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="infinixCurvedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
  </defs>
  <!-- Ultra slim 6.8mm body with curved edges -->
  <rect x="75" y="30" width="250" height="540" rx="42" fill="url(#infinixCurvedGrad)" stroke="#a855f7" stroke-width="2.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Curved Screen edge light highlights -->
  <path d="M 80 40 Q 75 300 80 560" stroke="#c084fc" stroke-width="3" opacity="0.8" fill="none"/>
  <path d="M 320 40 Q 325 300 320 560" stroke="#c084fc" stroke-width="3" opacity="0.8" fill="none"/>

  <!-- Sleek Minimal Camera Deco Island -->
  <rect x="95" y="80" width="100" height="150" rx="20" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
  <circle cx="145" cy="120" r="26" fill="#000" stroke="#c084fc" stroke-width="3"/>
  <circle cx="145" cy="120" r="16" fill="#7e22ce"/>
  <circle cx="142" cy="117" r="4" fill="#fff" opacity="0.9"/>

  <circle cx="145" cy="180" r="22" fill="#000" stroke="#c084fc" stroke-width="2.5"/>
  <circle cx="145" cy="180" r="12" fill="#7e22ce"/>

  <!-- 3D Curved Screen Badge -->
  <rect x="95" y="320" width="210" height="34" rx="17" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="200" y="342" fill="#f3e8ff" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">🌊 PANTALLA CURVA 3D 120Hz</text>

  <!-- RAM & Storage badge -->
  <rect x="110" y="370" width="180" height="28" rx="14" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1"/>
  <text x="200" y="388" fill="#00f2fe" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">⚡ 8GB + 256GB (16GB RAM)</text>

  <!-- Price -->
  <text x="200" y="465" fill="#00f59b" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="25" text-anchor="middle">Bs. 2.530</text>
  <text x="200" y="485" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">US$ 203,21</text>

  <text x="200" y="540" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle" letter-spacing="2" opacity="0.9">INFINIX HOT 60 PRO+</text>
</svg>
