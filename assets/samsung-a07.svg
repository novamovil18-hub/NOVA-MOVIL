<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="samsungA07Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect x="75" y="30" width="250" height="540" rx="36" fill="url(#samsungA07Bg)" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Vertical Dual Camera (Samsung Iconic layout) -->
  <circle cx="120" cy="95" r="24" fill="#000" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="120" cy="95" r="14" fill="#0284c7"/>
  <circle cx="117" cy="92" r="3" fill="#fff" opacity="0.8"/>

  <circle cx="120" cy="155" r="24" fill="#000" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="120" cy="155" r="14" fill="#0284c7"/>

  <!-- Flash -->
  <circle cx="160" cy="95" r="9" fill="#fff" stroke="#ffb703" stroke-width="2"/>

  <!-- Knox Vault Shield Badge -->
  <rect x="95" y="320" width="210" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="342" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">🛡️ SEGURIDAD SAMSUNG KNOX</text>

  <!-- Specs pill -->
  <rect x="110" y="370" width="180" height="28" rx="14" fill="rgba(0, 245, 155, 0.15)" stroke="#00f59b" stroke-width="1"/>
  <text x="200" y="388" fill="#00f59b" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">📸 50 MP & 4/128 GB</text>

  <!-- Price -->
  <text x="200" y="465" fill="#00f59b" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="25" text-anchor="middle">Bs. 1.520</text>
  <text x="200" y="485" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">US$ 122,09</text>

  <text x="200" y="540" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="3" opacity="0.9">SAMSUNG A07</text>
</svg>
