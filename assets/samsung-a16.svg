      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect x="75" y="30" width="250" height="540" rx="36" fill="url(#samsungA16Bg)" stroke="#60a5fa" stroke-width="2.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Vertical Triple Camera (Galaxy Design) -->
  <circle cx="120" cy="85" r="23" fill="#000" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="120" cy="85" r="14" fill="#0284c7"/>
  <circle cx="117" cy="82" r="3" fill="#fff" opacity="0.8"/>

  <circle cx="120" cy="140" r="23" fill="#000" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="120" cy="140" r="14" fill="#0284c7"/>

  <circle cx="120" cy="195" r="23" fill="#000" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="120" cy="195" r="14" fill="#0284c7"/>

  <!-- Flash -->
  <circle cx="160" cy="85" r="9" fill="#fff" stroke="#ffb703" stroke-width="2"/>

